;=== NEXAI · easybell-Trunk (nur ausgehend) + Vapi-Anbindung ===
[global]
type=global
endpoint_identifier_order=ip,auth_username,username
default_from_user=K4061981T1

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;--- Zugangsdaten (realm bewusst NICHT gesetzt: Asterisk uebernimmt ihn aus der Challenge)
[easybell-auth]
type=auth
auth_type=userpass
username=K4061981T1
password= SIP-PASSWORT-NUR-AUF-DEM-SERVER

;--- easybell-Trunk: KEINE Registrierung (eingehend laeuft weiter ueber Vapi)
[easybell]
type=endpoint
transport=transport-udp
context=from-easybell
disallow=all
allow=alaw,ulaw,g722
outbound_auth=easybell-auth
aors=easybell-aor
from_user=K4061981T1
from_domain=voip.easybell.de
send_pai=yes
trust_id_outbound=yes
send_rpid=no
callerid=<4979593100191>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
ice_support=no

rtp_keepalive=1
[easybell-aor]
type=aor
contact=sip:voip.easybell.de
qualify_frequency=60

[easybell-identify]
type=identify
endpoint=easybell
match=195.185.187.0/27
match=195.52.221.128/27

;--- Vapi: Erkennung ueber Quell-IP, keine Zugangsdaten noetig
[vapi]
type=endpoint
transport=transport-udp
context=from-vapi
disallow=all
allow=alaw,ulaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes

[vapi-identify]
type=identify
endpoint=vapi
match=44.229.228.186
match=44.238.177.138

;--- Weg zu Vapi (ausgehend von Asterisk)
[vapi-out]
type=endpoint
transport=transport-udp
disallow=all
allow=alaw,ulaw,g722
aors=vapi-out-aor
from_domain=18824f20-a401-4e40-afb0-319b4412b31c.sip.vapi.ai
direct_media=no
rtp_symmetric=yes
force_rport=yes

context=from-vapi
rtp_keepalive=1
[vapi-out-aor]
type=aor
contact=sip:18824f20-a401-4e40-afb0-319b4412b31c.sip.vapi.ai

;--- Registrierung bei easybell (fuer eingehende Anrufe)
[easybell-reg]
type=registration
transport=transport-udp
outbound_auth=easybell-auth
server_uri=sip:voip.easybell.de
client_uri=sip:K4061981T1@voip.easybell.de
contact_user=004979593100191
expiration=1800
retry_interval=60
forbidden_retry_interval=600
fatal_retry_interval=120
max_retries=0
auth_rejection_permanent=no
line=yes
endpoint=easybell
