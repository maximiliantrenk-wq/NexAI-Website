[general]
static=yes
writeprotect=yes
autofallthrough=yes

;--- Von easybell eingehend -> weiter an Vapi
[from-easybell]
exten => _+X.,1,Goto(toagent,1)
exten => _X.,1,Goto(toagent,1)
exten => toagent,1,NoOp(Eingehend von easybell -> Vapi)
 same => n,Dial(PJSIP/+4979593100191@vapi-out,60)
 same => n,Hangup()

;--- Von Vapi (Transfer/Weiterleitung) -> raus ueber easybell
[from-vapi]
exten => _+X.,1,Set(TARGET=00${EXTEN:1})
 same => n,Goto(place,1)
exten => _X.,1,Set(TARGET=${EXTEN})
 same => n,Goto(place,1)
exten => place,1,NoOp(Weiterleitung an ${TARGET})
 same => n,Set(CALLERID(num)=4979593100191)
 same => n,GotoIf($["${TARGET}" = "004979593100196"]?gruppe,1)
 same => n,Dial(PJSIP/${TARGET}@easybell,30)
 same => n,Hangup()
; Rufgruppe: Asterisk waehlt beide Handys SELBST parallel. Lehnt einer ab,
; klingelt es beim anderen weiter -- anders als bei easybells Parallelruf,
; der den gesamten Ruf beendet, sobald eine Seite auflegt.
exten => gruppe,1,NoOp(Rufgruppe parallel: Max + Jason)
 same => n,Dial(PJSIP/00491728456815@easybell&PJSIP/004917680714816@easybell,30)
 same => n,Hangup()
;--- Roboter-Testanruf: waehlt die eigene Nummer und bittet um einen Mitarbeiter.
; NICHT im Produktivweg -- laeuft nur per "channel originate ... extension s@robo-test".
[robo-test]
exten => s,1,Answer()
 same => n,Wait(11)
 same => n,Playback(/var/lib/asterisk/sounds/nexai-wunsch)
 same => n,Wait(50)
 same => n,Hangup()
